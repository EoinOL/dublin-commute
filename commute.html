<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dublin Commute Calculator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3498db">
<style>
  body { font-family: sans-serif; margin: 10px; background: #f0f0f0; }
  h1 { text-align: center; }
  .input-group { margin-bottom: 10px; }
  input { width: 100%; padding: 8px; font-size: 16px; margin-bottom: 5px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; font-size: 18px; background: #3498db; color: white; border: none; border-radius: 5px; }
  button:hover { background: #217dbb; cursor: pointer; }
  .output-box { background: white; padding: 10px; margin-bottom: 10px; border-radius: 5px; min-height: 120px; overflow-y: auto; font-size: 16px; }
  .green { background-color: #d4edda; }
  .blue { background-color: #d1ecf1; }
  .totals { margin: 10px 0; font-weight: bold; text-align: center; }
  .route { margin-bottom: 10px; white-space: pre-line; }
</style>
</head>
<body>
<h1>Dublin Commute Calculator v1.01</h1>

<div class="input-group">
  <input type="text" id="homeEircode" placeholder="Home Eircode">
  <input type="text" id="workEircode" placeholder="Work Eircode" value="D20 W722">
</div>
<button id="calculateBtn">Get Commute</button>

<div class="totals" id="totalsDiv"></div>

<div class="output-box" id="morningOutput" placeholder="Morning routes"></div>
<div class="output-box" id="eveningOutput" placeholder="Evening routes"></div>

<script>
const workerUrlBase = 'https://green-fog-b3ad.eoinol.workers.dev/';

function formatDuration(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return h > 0 ? `${h}h${m}m` : `${m} mins`;
}

function formatTime(timestamp) {
  const d = new Date(timestamp * 1000);
  const h = d.getHours().toString().padStart(2,'0');
  const m = d.getMinutes().toString().padStart(2,'0');
  return `${h}:${m}`;
}

async function fetchRoutes(origin, destination, arrival_time=null, departure_time=null) {
  const params = new URLSearchParams();
  params.set('origin', origin);
  params.set('destination', destination);
  params.set('mode', 'transit');
  params.set('alternatives', 'true');
  if (arrival_time) params.set('arrival_time', arrival_time);
  if (departure_time) params.set('departure_time', departure_time);

  const resp = await fetch(`${workerUrlBase}?${params.toString()}`);
  return resp.json();
}

function processRoutes(data) {
  if (!data.routes || data.routes.length === 0) return [];
  return data.routes.map(r => {
    const steps = [];
    let durationMinutes = 0;
    let depTimestamp = null;
    let arrTimestamp = null;
    r.legs.forEach(leg => {
      leg.steps.forEach(step => {
        let instr = step.html_instructions.replace(/<[^>]+>/g, '');
        steps.push(instr);
      });
      durationMinutes += leg.duration.value / 60;
      depTimestamp = depTimestamp || leg.departure_time.value;
      arrTimestamp = leg.arrival_time.value;
    });
    return { steps, durationMinutes: Math.round(durationMinutes), depTimestamp, arrTimestamp };
  });
}

function renderRoutes(routes, container, greenSelector, blueSelector) {
  container.innerHTML = '';
  const greenTime = greenSelector(routes);
  const blueTime = blueSelector(routes);

  routes.forEach(r => {
    const div = document.createElement('div');
    div.classList.add('route');
    div.innerHTML = `
Duration: ${formatDuration(r.durationMinutes)} - Times: ${formatTime(r.depTimestamp)} to ${formatTime(r.arrTimestamp)}<br>
Route: ${r.steps.join(' -> ')}
    `;
    if (r.depTimestamp === greenTime || r.arrTimestamp === greenTime) div.classList.add('green');
    else if (r.durationMinutes === blueTime) div.classList.add('blue');
    container.appendChild(div);
  });
}

document.getElementById('calculateBtn').addEventListener('click', async () => {
  const home = document.getElementById('homeEircode').value.trim();
  const work = document.getElementById('workEircode').value.trim();
  if (!home || !work) { alert('Please enter both Eircodes'); return; }

  const today = new Date();
  const nextTuesday = new Date(today.getTime() + ((9 - today.getDay()) % 7) * 86400000);
  const arrivalMorning = Math.floor(new Date(nextTuesday.getFullYear(), nextTuesday.getMonth(), nextTuesday.getDate(), 7, 30).getTime() / 1000);
  const departureEvening = Math.floor(new Date(nextTuesday.getFullYear(), nextTuesday.getMonth(), nextTuesday.getDate(), 16, 0).getTime() / 1000);

  const [morningData, eveningData] = await Promise.all([
    fetchRoutes(home, work, arrivalMorning, null),
    fetchRoutes(work, home, null, departureEvening)
  ]);

  const morningRoutes = processRoutes(morningData);
  const eveningRoutes = processRoutes(eveningData);

  // Render morning
  renderRoutes(
    morningRoutes,
    document.getElementById('morningOutput'),
    routes => Math.max(...routes.map(r => r.depTimestamp)), // green: latest departure
    routes => Math.min(...routes.map(r => r.durationMinutes)) // blue: shortest
  );

  // Render evening
  renderRoutes(
    eveningRoutes,
    document.getElementById('eveningOutput'),
    routes => Math.min(...routes.map(r => r.arrTimestamp)), // green: earliest arrival
    routes => Math.min(...routes.map(r => r.durationMinutes)) // blue: shortest
  );

  // Totals
  const realistic = (morningRoutes.find(r => r.depTimestamp === Math.max(...morningRoutes.map(r=>r.depTimestamp)))?.durationMinutes || 0) +
                    (eveningRoutes.find(r => r.arrTimestamp === Math.min(...eveningRoutes.map(r=>r.arrTimestamp)))?.durationMinutes || 0);
  const shortest = (morningRoutes.find(r => r.durationMinutes === Math.min(...morningRoutes.map(r=>r.durationMinutes)))?.durationMinutes || 0) +
                   (eveningRoutes.find(r => r.durationMinutes === Math.min(...eveningRoutes.map(r=>r.durationMinutes)))?.durationMinutes || 0);

  document.getElementById('totalsDiv').textContent = `Realistic commute: ${formatDuration(realistic)} | Shortest commute: ${formatDuration(shortest)}`;
});
</script>

</body>
</html>
